on:
  workflow_call:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          args:
            --config=./.github/golangci.yaml
